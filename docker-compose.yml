version: '3.8'
services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contacts-backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development 
      PORT: 8082
    ports:
      - "3001:8082"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    networks:
      - contacts-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contacts-frontend 
    ports:
      - "3000:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - contacts-network
    command: npm run dev --host 0.0.0.0

networks:
  contacts-network:
    driver: bridge

volumes:
  backend_node_modules:
  frontend_node_modules: